{% set name = "ptufile" %}
{% set version = "2026.10.16" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ptufile-{{ version }}.tar.gz
  sha256: 54525cebbfe2d3ad0a8f5e1003c419891b1cd9bfb861057a3273db1fd1dd921e

build:
  skip: true  # [py<312]
  entry_points:
    - ptufile = ptufile.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.1.2                         # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools >=68
    - numpy
    - cython >=3.1.2
    - pip
  run:
    - python
    - xarray >=2023.4.0
    - tifffile >=2024.8.30

test:
  imports:
    - ptufile
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://www.cgohlke.com
  summary: Read and write PicoQuant PTU and related files
  description: |
    Ptufile is a Python library to read data and metadata from PicoQuant PTU and 
    related files (PHU, PCK, PCO, PFS, PUS, PQRES, PQDAT, PQUNI, SPQR, and BIN), 
    and write TCSPC histograms to T3 image mode PTU files.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/cgohlke/ptufile

extra:
  recipe-maintainers:
    - cgohlke
